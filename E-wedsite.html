<!DOCTYPE html>
<html>
<head>
    <title>E-Website</title>
</head>
<body>
    <!-- Navigation Menu -->
    <nav>
        <a href="#home">Home</a> |
        <a href="#products">Products</a> |
        <a href="#contact">Contact</a>
    </nav>

    <h1 id="home">Welcome to My Website</h1>

    <!-- Table -->
    <h2 id="products">Product List</h2>
    <table border="1">
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>$800</td>
        </tr>
        <tr>
            <td>Phone</td>
            <td>$500</td>
        </tr>
    </table>

    <!-- Image -->
    <h2>Sample Image</h2>
    <img src="img1.jpg" alt="Handheld microphone on a desk in a recording space with soft warm lighting" width="500">

    <!-- Contact Section -->
    <h2 id="contact">Contact Us</h2>
    <p>Email: example@email.com</p>
</body>
</html>
