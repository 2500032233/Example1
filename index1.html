<!DOCTYPE html>
<html>
<head>
    <title>HTML Tags Example</title>
</head>
<body>

    <h1>Welcome to HTML</h1>

    <hr>

    <p>
        HTML stands for <b>HyperText Markup Language</b>.<br>
        It is used to <strong>create web pages</strong>.<br>
        HTML is <i>easy to learn</i> and <em>very useful</em>.<br>
        You can <u>underline text</u> using the u tag.<br>
        You can also <mark>highlight important text</mark>.
    </p>

    <hr>

    <p>
        <b>Bold Text</b><br>
        <strong>Strong Text</strong><br>
        <i>Italic Text</i><br>
        <em>Emphasized Text</em><br>
        <u>Underlined Text</u><br>
        <mark>Highlighted Text</mark>
    </p>

</body>
</html>
